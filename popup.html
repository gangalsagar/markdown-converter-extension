<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  body { margin:0; width:260px; font-family:system-ui,sans-serif; background:#0f172a; color:#e5e7eb; padding:14px; }
  h1 { font-size:15px; margin:0 0 8px; }
  p { font-size:12px; color:#9ca3af; margin:0 0 12px; line-height:1.5; }
  button { width:100%; padding:8px; border:none; border-radius:6px; background:#3b82f6; color:#fff; font-weight:600; cursor:pointer; }
  button:hover { background:#2563eb; }
</style>
</head>
<body>
  <h1>PDF to Markdown</h1>
  <p>Drag & drop any PDF on a page or here in the side panel to convert it to Markdown. The result is copied to your clipboard.</p>
  <button id="openPanel">Open Side Panel</button>
  <script src="popup.js"></script>
</body>
</html>
